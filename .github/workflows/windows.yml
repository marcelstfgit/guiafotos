name: Windows build and smoke test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-only SSCD export dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows package with pinned tools
        shell: pwsh
        run: ./build-windows.ps1 -WithSscd
      - name: Core integration tests including DPAPI and Windows tools
        shell: pwsh
        run: |
          $env:GUIAFOTOS_TOOLS_ROOT = (Resolve-Path artifacts/windows-x64).Path
          dotnet run --project tests/GuiaFotos.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: WPF launch smoke test
        shell: pwsh
        run: |
          $process = Start-Process artifacts/windows-x64/GuiaFotos.exe -ArgumentList '--smoke-test' -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'WPF smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'WPF smoke test failed' }
      - name: Native recognition, trained models, person search and fast duplicate tests
        shell: pwsh
        run: |
          $env:GUIAFOTOS_TOOLS_ROOT = (Resolve-Path artifacts/windows-x64).Path
          $env:GUIAFOTOS_ONNX_LIBRARY = (Resolve-Path artifacts/windows-x64/tools/faces/onnxruntime.dll).Path
          $env:GUIAFOTOS_TEST_PRETRAINED = '1'
          dotnet run --project tests/GuiaFotos.AdvancedTests/GuiaFotos.AdvancedTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full grouping, persistent index, corrections and image variants
        shell: pwsh
        run: |
          $env:GUIAFOTOS_TOOLS_ROOT = (Resolve-Path artifacts/windows-x64).Path
          dotnet run --project tests/GuiaFotos.GroupingTests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer integrity and removal path tests
        shell: pwsh
        run: |
          dotnet run --project installer/tests/Setup.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, launch, uninstall and portable smoke tests
        shell: pwsh
        run: ./installer/test-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GuiaFotos-windows-x64
          path: |
            artifacts/GuiaFotos-0.2.0-Setup.exe
            artifacts/GuiaFotos-0.2.0-portatil-windows-x64.zip
            artifacts/GuiaFotos-0.2.0-fonte.zip
            artifacts/GuiaFotos-0.2.0-SHA256SUMS.txt
            artifacts/GuiaFotos-0.2.0-validacao-pacotes.json
