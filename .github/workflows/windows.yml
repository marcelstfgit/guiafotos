name: Windows build and smoke test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release gate regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p test_release_validation.py
      - uses: actions/cache/restore@v4
        id: ffmpeg-cache
        with:
          key: windows-ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          path: |
            tools/windows/ffmpeg.exe
            tools/windows/ffprobe.exe
            tools/windows/ffmpeg-build.json
            tools/windows/licenses/ffmpeg
            artifacts/GuiaFotos-0.2.0-fontes-dependencias.zip
      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          install: make nasm diffutils curl mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
      - name: Build FFmpeg with corresponding sources
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh
      - uses: actions/cache/save@v4
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          key: windows-ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          path: |
            tools/windows/ffmpeg.exe
            tools/windows/ffprobe.exe
            tools/windows/ffmpeg-build.json
            tools/windows/licenses/ffmpeg
            artifacts/GuiaFotos-0.2.0-fontes-dependencias.zip
      - name: Install build-only SSCD export dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@v4
        id: tools-cache
        with:
          key: windows-tools-${{ hashFiles('build-windows.ps1') }}
          path: artifacts/downloads
      - name: Build Windows package with pinned tools
        id: package
        shell: pwsh
        run: |
          try { ./build-windows.ps1 -WithSscd }
          catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$message"
            Write-Host $_.ScriptStackTrace
            $_ | Format-List * -Force
            exit 1
          }
      - uses: actions/cache/save@v4
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          key: windows-tools-${{ hashFiles('build-windows.ps1') }}
          path: artifacts/downloads
      - name: Core integration tests including DPAPI and Windows tools
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:GUIAFOTOS_TOOLS_ROOT = (Resolve-Path artifacts/windows-x64).Path
          ./scripts/run-tests.ps1 -Project tests/GuiaFotos.Tests -Log artifacts/test-core.log
      - name: WPF launch smoke test
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:GUIAFOTOS_SMOKE_LOG = Join-Path (Resolve-Path artifacts).Path 'wpf-smoke-error.log'
          $process = Start-Process artifacts/windows-x64/GuiaFotos.exe -ArgumentList '--smoke-test' -PassThru -RedirectStandardOutput artifacts/wpf-stdout.log -RedirectStandardError artifacts/wpf-stderr.log
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'WPF smoke test timed out' }
          if ($process.ExitCode -ne 0) {
            $details = (Get-Content artifacts/wpf-smoke-error.log, artifacts/wpf-stdout.log, artifacts/wpf-stderr.log -ErrorAction SilentlyContinue | Out-String).Trim()
            $message = "WPF exit $($process.ExitCode): $details".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$message"
            throw 'WPF smoke test failed'
          }
          'PASS WPF initialization and shutdown' | Set-Content -Encoding utf8 artifacts/test-wpf.log
      - name: Native recognition, trained models, person search and fast duplicate tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:GUIAFOTOS_TOOLS_ROOT = (Resolve-Path artifacts/windows-x64).Path
          $env:GUIAFOTOS_ONNX_LIBRARY = (Resolve-Path artifacts/windows-x64/tools/faces/onnxruntime.dll).Path
          $env:GUIAFOTOS_TEST_PRETRAINED = '1'
          ./scripts/run-tests.ps1 -Project tests/GuiaFotos.AdvancedTests/GuiaFotos.AdvancedTests.csproj -Log artifacts/test-advanced.log
      - name: Exercise desktop photo flow and capture real WPF views
        id: ui-review
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:GUIAFOTOS_SMOKE_LOG = Join-Path (Resolve-Path artifacts).Path 'ui-review-error.log'
          $process = Start-Process artifacts/windows-x64/GuiaFotos.exe -ArgumentList '--ui-review artifacts/ui-review tests/ui-sample-photos.json' -PassThru
          if (!$process.WaitForExit(240000)) { $process.Kill(); throw 'Desktop UI review timed out' }
          if ($process.ExitCode -ne 0) {
            $details = (Get-Content artifacts/ui-review-error.log, artifacts/ui-review/erro-interface.txt -ErrorAction SilentlyContinue | Out-String).Trim().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$details"
            throw 'Desktop UI review failed'
          }
          if (!(Test-Path artifacts/ui-review/validacao-interface.json)) { throw 'Desktop flow did not produce its completion report' }
      - uses: actions/checkout@v4
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.package.outcome == 'success' }}
        with:
          ref: ui-previews
          path: artifacts/ui-preview-site
      - name: Publish desktop screenshots for visual review
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/ui-review)) { exit 0 }
          foreach ($name in @('biblioteca-vazia-1366.png', 'biblioteca-1366.png', 'biblioteca-1920-150.png', 'editor-1366.png', 'recorte-1366.png', 'falha-interface.png', 'validacao-interface.json', 'erro-interface.txt', 'ui-sample-photos.json')) {
            Remove-Item (Join-Path artifacts/ui-preview-site $name) -Force -ErrorAction SilentlyContinue
          }
          Copy-Item artifacts/ui-review/* artifacts/ui-preview-site/ -Force
          Push-Location artifacts/ui-preview-site
          git config user.name 'GuiaFotos CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: desktop UI review $env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin ui-previews
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Pop-Location
      - name: Full grouping, persistent index, corrections and image variants
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:GUIAFOTOS_TOOLS_ROOT = (Resolve-Path artifacts/windows-x64).Path
          ./scripts/run-tests.ps1 -Project tests/GuiaFotos.GroupingTests -Log artifacts/test-grouping.log
      - name: Installer integrity and removal path tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/run-tests.ps1 -Project installer/tests/Setup.Tests.csproj -Log artifacts/test-installer.log
      - name: Install, launch, uninstall and portable smoke tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: ./installer/test-windows.ps1 2>&1 | Tee-Object -FilePath artifacts/test-install-portable.log
      - name: Record completed Windows checks
        shell: pwsh
        run: python scripts/record-windows-validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: GuiaFotos-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/GuiaFotos-0.2.1-Setup.exe
            artifacts/GuiaFotos-0.2.1-portatil-windows-x64.zip
            artifacts/GuiaFotos-0.2.1-fonte.zip
            artifacts/GuiaFotos-0.2.1-fontes-dependencias.zip
            artifacts/GuiaFotos-0.2.1-interface.zip
            artifacts/GuiaFotos-0.2.1-SHA256SUMS.txt
            artifacts/GuiaFotos-0.2.1-validacao-pacotes.json
            artifacts/ImageMagick-7.1.2-33-Windows.7z
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GuiaFotos-windows-x64
          path: artifacts
      - name: Verify release artifacts and Windows evidence
        run: python3 scripts/record-windows-validation.py --verify-only
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag --prerelease
          --title "GuiaFotos ${GITHUB_REF_NAME#v}"
          --notes-file RELEASE-NOTES.txt
          artifacts/GuiaFotos-*-Setup.exe
          artifacts/GuiaFotos-*-portatil-windows-x64.zip
          artifacts/GuiaFotos-*-fonte.zip
          artifacts/GuiaFotos-*-fontes-dependencias.zip
          artifacts/GuiaFotos-*-interface.zip
          artifacts/GuiaFotos-*-SHA256SUMS.txt
          artifacts/GuiaFotos-*-validacao-pacotes.json
          artifacts/ImageMagick-7.1.2-33-Windows.7z
